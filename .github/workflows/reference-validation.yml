name: Validate frozen reference analysis
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  reference:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install reference-mode dependency
        run: Rscript -e 'install.packages("readxl", repos="https://cloud.r-project.org", Ncpus=1L)'
      - name: Parse all R scripts
        run: Rscript -e 'invisible(lapply(list.files(".", pattern="[.]R$", recursive=TRUE, full.names=TRUE), parse))'
      - name: Verify reference file integrity
        run: Rscript scripts/verify_bundle.R
      - name: Recalculate reference statistics
        run: Rscript run_analysis.R reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-results
          path: results/reference/
